name: Tests

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "master" ]

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: install build dependencies
      run: sudo apt-get install -y universal-ctags readline-common libreadline-dev xutils-dev
    - name: clone and install picky
      run: |
        git clone https://github.com/lcn2/picky
        cd picky && sudo make install
    - name: build
      run: make clobber all
    - name: run regression tests
      run: make check
    - name: verify regression test output
      run: make chk
